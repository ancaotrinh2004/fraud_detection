# Strimzi Kafka — KRaft mode, single-node for Kind dev
#
# Bootstrap: fraud-kafka-kafka-bootstrap.fraud-infra.svc.cluster.local:9092
#
# Deploy:
#   kubectl create -f 'https://strimzi.io/install/latest?namespace=fraud-infra'
#   kubectl apply -f infra/k8s/kafka/kafka.yaml
#   kubectl apply -f infra/k8s/kafka/kafka-topics.yaml

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: fraud-pool
  namespace: fraud-infra
  labels:
    strimzi.io/cluster: fraud-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral          # dev: no PVC needed; switch to persistent for prod
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1"

---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: fraud-kafka
  namespace: fraud-infra
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    metadataVersion: "4.1-IV0"

    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      num.partitions: 3
      auto.create.topics.enable: "true"
      log.retention.hours: 24
      log.segment.bytes: 536870912
  entityOperator:
    topicOperator: {}
