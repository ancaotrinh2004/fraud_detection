# infra/k8s/pushgateway.yaml
#
# Prometheus Pushgateway — receives metrics pushed by short-lived batch jobs
# (drift_monitor, ml_label, ml_train pipelines) so Prometheus can scrape them.
#
# Apply: kubectl apply -f infra/k8s/pushgateway.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.10.0
          ports:
            - name: metrics
              containerPort: 9091
          args:
            # Persist metrics across pod restarts so a restart doesn't wipe
            # the last pipeline run's values before Prometheus scrapes them.
            - --persistence.file=/data/pushgateway.db
            - --persistence.interval=5m
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app: pushgateway
spec:
  selector:
    app: pushgateway
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
