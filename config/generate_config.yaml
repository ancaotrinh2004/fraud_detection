# ─────────────────────────────────────────────
# Fraud Detection — Data Generator Config
# ─────────────────────────────────────────────

# Entity volumes
n_customers: 120000
n_merchants: 15000
n_cards: 130000           # ~1.3 cards per customer
days_history: 180
avg_txn_per_customer: 12  # ~2 transactions/month

# Output paths
output_dir: "data/raw"

# Fraud settings
# Natural fraud rate (before calibration): ~8% overall (~3% pre-Jul, ~11% post-Jul).
# Calibration flips only ~10% of post-Jul labels to hit 10% target — signal is preserved.
fraud_rate: 0.10
fraud_label_min_conditions: 2

# Geographic skew
top_cities:
  - Ho Chi Minh City
  - Hanoi
  - Da Nang
  - Can Tho
  - Hai Phong
skew_city_ratio: 0.80       # 80% txns from top 5 cities
skew_category_ratio: 0.75   # 75% merchants in top 3 categories

# Offline data problems
duplicate_rate_offline: 0.02
schema_change_date: "2025-07-01"  # device_fingerprint + ip_country added after this

# Streaming settings
base_events_per_min: 50
burst_multiplier: 40
burst_windows:
  - start: "12:00"
    end: "12:20"
  - start: "22:00"
    end: "22:20"
late_arrival_rate: 0.15
late_delay_min: 5
late_delay_max: 60
duplicate_rate_stream: 0.015

# Reproducibility
random_seed: 42

# Feature drift — Scenario B: Transaction Amount Drift
drift_enabled: true
drift_start_date: "2025-08-01"
drift_mode: "gradual"          # gradual: ramp up over drift_ramp_days; abrupt: instant jump
scenario_B_amount: true
amount_drift_multiplier: 1.30  # 30% increase after drift_start_date
drift_ramp_days: 30            # days to reach full multiplier (gradual mode only)