# config/pipeline_config.yaml

# ── Storage ───────────────────────────────────────────────
raw_base_path:    "s3://raw"      # Raw source data (uploaded once via mc)
bronze_base_path: "s3://bronze"   # Delta Lake Bronze
silver_base_path: "s3://silver"   # Delta Lake Silver

dead_letter_base_path: "data/dead_letter"   # local/ephemeral inside pod is fine

# ── MinIO (S3-compatible object storage) ──────────────────
minio:
  endpoint_url: "http://fraud-minio.fraud-infra.svc.cluster.local:9000"
  access_key: "fraud_minio_user"    # override via env: MINIO_ACCESS_KEY
  secret_key: "fraud_minio_pass"    # override via env: MINIO_SECRET_KEY

# ── PostgreSQL (Gold + Features) ─────────────────────────
postgres:
  host: "fraud-postgres-postgresql.fraud-infra.svc.cluster.local"
  port: 5432
  database: "fraud_detection"
  user: "fraud_user"
  password: "fraud_pass"            # override via env: POSTGRES_PASSWORD
  schema: "gold_fraud"

# ── Pipeline controls ─────────────────────────────────────
retry_max_attempts: 3
retry_backoff_seconds: [120, 480, 1920]   # 2min, 8min, 32min

# ── Quality thresholds ────────────────────────────────────
quality:
  fraud_rate_min: 0.005
  fraud_rate_max: 0.150
  volume_drop_pct: 0.50            # alert if row count drops >50% vs 7d avg
  max_dead_letter_pct: 0.001       # alert if >0.1% rows rejected

# ── SLA targets (minutes) ────────────────────────────────
sla:
  bronze_freshness_min: 10
  silver_freshness_min: 30
  gold_freshness_min: 30
  feat_customer_90d_min: 60
  feat_stream_30m_min: 5
  feat_unified_min: 15

# ── Kafka streaming ───────────────────────────────────────
kafka:
  enabled: true                     # set true after Kafka is deployed
  bootstrap_servers: "fraud-kafka-kafka-bootstrap.fraud-infra.svc.cluster.local:9092"
  topic_fraud_events: "fraud.events.raw"
  consumer_group: "bronze-ingest-events"
  poll_timeout_ms: 30000            # how long Bronze consumer polls per Airflow trigger
  batch_size: 1000                  # messages per poll batch

# ── MLflow model registry ─────────────────────────────────
mlflow:
  tracking_uri: "http://mlflow.fraud-infra.svc.cluster.local:5000"
  experiment_name: "fraud-detection"
  model_name: "fraud-xgboost"
  artifact_bucket: "mlflow-artifacts"

# ── Alerting ──────────────────────────────────────────────
alerting:
  discord_webhook_url: "https://discord.com/api/webhooks/1512885679514849473/-cUfoZM6M3-qa8jm7XdgasxXT66ZAEp5dEKpzMy2biqKZrIw0iKxOp00OKDoxSUmHaoe"    # override via env: DISCORD_WEBHOOK_URL